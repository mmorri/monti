[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model-router"
version = "0.1.0"
description = "Subscription-only difficulty-based model router (no API keys)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
monti = "model_router.cli:main"
model-router = "model_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
