tiers:
  # Each tier is an ordered pool of interchangeable candidates: same quality
  # band, different subscription wallets. List order is wallet preference —
  # the first logged-in, non-cooling candidate serves. `monti models` shows
  # each logged-in provider's live catalog; confirm model IDs there after
  # logging into a new provider (IDs below for pending logins are the
  # documented API names and may need adjusting to catalog UIDs).
  everyday:
    - { provider: zai,  model: "glm-5.3-flash" }
    - { provider: kimi, model: "kimi-for-coding-highspeed" }
  moderate:
    - { provider: kimi,     model: "kimi-for-coding" }
    - { provider: windsurf, model: "gpt-5.5" }
  high:
    - { provider: zai,  model: "glm-5.3" }
    - { provider: kimi, model: "k3" }
    - { provider: muse, model: "muse-spark-1.3" }
  very_high:
    - { provider: anthropic, model: "claude-fable-5-1" }
    - { provider: windsurf,  model: "claude-fable-5-1" }
    - { provider: openai,    model: "gpt-6-astra" }
    - { provider: muse,       model: "muse-spark-1.3" }
policy:
  default_mode: auto
  # modes: auto | everyday-only | moderate-only | high-only | very-high-only
  #        | weak-first-escalate
  # Strict startup: refuse unless every tier has at least one logged-in,
  # transport-ready candidate. A router with missing pieces is not a router.
  require_all_tiers: true
  # A 429/quota-drained provider stays out of rotation this long (seconds).
  cooldown_seconds: 300
  escalation:
    tool_error_threshold: 3
    signals:
      - "this isn't working"
      - "this is not working"
      - "try a different approach"
      - "that didn't work"
      - "still failing"
      - "still broken"
# Optional per-provider overrides (host URLs only — never keys):
# providers:
#   kimi:  { domain: "kimi.com" }   # CN subscription; kimi.ai is the default
#   xai:   { gateway_base_url: "https://cli-chat-proxy.grok.com/v1" }
port: 8787
log_dir: "~/.config/model-router/logs"
